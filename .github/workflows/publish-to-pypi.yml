name: Publish package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]), "Expected vMAJOR.MINOR.PATCH"'
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install -e '.[test]' build twine
      - run: python -m pytest && python -m build && python -m twine check dist/*
      - name: Validate built wheel and source distribution
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/validate_distributions.py dist --release-tag "$RELEASE_TAG"
      - name: Test release artifacts outside the checkout
        run: |
          python -m venv /tmp/release-wheel
          /tmp/release-wheel/bin/pip install dist/*.whl pytest
          (cd /tmp && /tmp/release-wheel/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_packaging.py")
          mkdir /tmp/release-sdist
          tar -xf dist/*.tar.gz -C /tmp/release-sdist --strip-components=1
          (cd /tmp/release-sdist && python -m build --wheel)
          python -m venv /tmp/release-source
          /tmp/release-source/bin/pip install /tmp/release-sdist/dist/*.whl pytest
          (cd /tmp && /tmp/release-source/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_packaging.py")
      - uses: pypa/gh-action-pypi-publish@release/v1
