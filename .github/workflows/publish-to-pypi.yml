name: Publish package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]), "Expected vMAJOR.MINOR.PATCH"'
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install -e '.[test]' build twine
      - run: python -m pytest && python -m build && python -m twine check dist/*
      - name: Verify wheel version matches release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c 'import os,importlib.metadata as m; assert m.version("citsci-analysis") == os.environ["RELEASE_TAG"][1:]'
      - uses: pypa/gh-action-pypi-publish@release/v1
