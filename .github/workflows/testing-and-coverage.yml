name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    permissions:
      contents: read
      id-token: write
    name: Tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest --cov=citsci_analysis --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          use_oidc: true
          fail_ci_if_error: true
  minimum:
    name: Lowest direct dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - run: uv pip compile --resolution=lowest-direct pyproject.toml -o /tmp/lowest.txt
      - run: uv pip install --system -c /tmp/lowest.txt -e '.[test]'
      - run: python -m pytest
