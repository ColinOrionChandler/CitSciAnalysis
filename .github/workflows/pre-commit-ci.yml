name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - run: ruff check . && ruff format --check .
  typing:
    name: Strict mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[typing]'
      - run: mypy
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - name: Test installed wheel outside source checkout
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl pytest
          cd /tmp
          /tmp/wheel-env/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_packaging.py"
      - name: Rebuild and test source distribution without Git
        run: |
          mkdir /tmp/sdist
          tar -xf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          python -m build --wheel
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install dist/*.whl pytest
          cd /tmp
          /tmp/sdist-env/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_packaging.py"
