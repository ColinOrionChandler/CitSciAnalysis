[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citsci-analysis"
version = "0.1.0"
description = "Modern scoring tools for Active Asteroids citizen-science classifications."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.scripts]
citsci-score = "citsci_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
